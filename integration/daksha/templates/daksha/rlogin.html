{% load static %}

<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Login</title>
        <link href="{% static 'daksha/login.css' %}" rel="stylesheet" />
        <style>
            .bg-hero {
                background-color: #111827;
            }
            input[type="text"],
            input[type="password"] {
                padding: 0.25rem 0.75rem;
            }
            .alert-container {
                display: none;
            }

            .alert-content {
                text-align: center;
            }
        </style>
        <script>
            document.addEventListener("DOMContentLoaded", function () {
                var showAlertButton = document.getElementById("showAlertButton");
                var closeButton = document.querySelector(".alert button");
                var alertContainer = document.querySelector(".alert-container");
                var alert = document.querySelector(".alert");

                showAlertButton.addEventListener("click", function () {
                    alertContainer.style.display = "flex";
                    alert.style.display = "flex";
                });

                closeButton.addEventListener("click", function () {
                    alertContainer.style.display = "none";
                    alert.style.display = "none";
                });
            });
        </script>
    </head>

    <body>
        <div class="flex h-screen flex-1 flex-col justify-center px-6 py-12 lg:px-8 bg-hero">
            <div class="sm:mx-auto sm:w-full sm:max-w-sm">
                <a href="{% url 'index' %}"><img class="mx-auto h-10 w-auto" src="{% static 'daksha/assets/main_logo.png' %}" alt="Your Company" /></a>
                <h2 class="mt-10 text-center text-2xl font-bold leading-9 tracking-tight text-white">
                    Log in to your account
                </h2>
            </div>
            
            <div class="mt-10 sm:mx-auto sm:w-full sm:max-w-sm">
                {% if message %}
                <div class="alert-container justify-center mt-10">
                <div role="alert" class="rounded border-s-4 border-red-500 bg-red-50 p-4 alert">
                    <div class="flex items-center gap-2 text-red-800">
                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" class="h-5 w-5">
                            <path
                                fill-rule="evenodd"
                                d="M9.401 3.003c1.155-2 4.043-2 5.197 0l7.355 12.748c1.154 2-.29 4.5-2.599 4.5H4.645c-2.309 0-3.752-2.5-2.598-4.5L9.4 3.003zM12 8.25a.75.75 0 01.75.75v3.75a.75.75 0 01-1.5 0V9a.75.75 0 01.75-.75zm0 8.25a.75.75 0 100-1.5.75.75 0 000 1.5z"
                                clip-rule="evenodd"
                            />
                        </svg>

                        <strong class="block font-medium">{{message}}</strong>
                    </div>
                </div>
            </div>
                {% endif %}
                <form class="space-y-6" action="/SignIn" method="POST">
                    {% csrf_token %}
                    <div>
                        <label for="email" class="block text-sm font-medium leading-6 text-white">
                            Username
                        </label>
                        <div class="mt-2">
                            <input
                                id="username"
                                name="username"
                                type="text"
                                autocomplete="username"
                                required
                                class="block w-full rounded-md border-0 py-1.5 text-gray-900 shadow-sm ring-1 ring-inset ring-gray-300 placeholder:text-gray-400 focus:ring-2 focus:ring-inset focus:ring-indigo-600 sm:text-sm sm:leading-6"
                            />
                        </div>
                    </div>

                    <div>
                        <div class="flex items-center justify-between">
                            <label for="password" class="block text-sm font-medium leading-6 text-white">
                                Password
                            </label>
                        </div>
                        <div class="mt-2">
                            <input
                                id="password"
                                name="password"
                                type="password"
                                autocomplete="current-password"
                                required
                                class="block w-full rounded-md border-0 py-1.5 text-gray-900 shadow-sm ring-1 ring-inset ring-gray-300 placeholder:text-gray-400 focus:ring-2 focus:ring-inset focus:ring-indigo-600 sm:text-sm sm:leading-6"
                            />
                        </div>
                    </div>

                    <div>
                        <button
                            id="showAlertButton"
                            type="submit"
                            class="flex w-full justify-center rounded-md bg-indigo-600 hover:text-white px-3 py-1.5 text-sm font-semibold leading-6 text-white shadow-sm hover:bg-indigo-500 focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-indigo-600"
                        >
                            Log in
                        </button>
                    </div>
                </form>

                <p class="mt-10 text-center text-sm text-gray-500">Not a member? <a href="{% url 'register' %}" class="font-semibold leading-6 text-indigo-600 hover:text-indigo-500">Create account</a></p>
            </div>
        </div>
    </body>
</html>
