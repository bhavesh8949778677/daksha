<!DOCTYPE html>
<html>
<head>
  <title>View Project - MUSIC PLAYER</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/normalize/8.0.1/normalize.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css">
  <style>
    * {
      box-sizing: border-box;
    }

    html {
      font-size: 16px;
    }

    body {
      font-family: sans-serif;
      margin: 0;
      padding: 1.25rem;
      background-color: #f5f5f5;
    }

    .container {
      max-width: 37.5rem;
      margin: 0 auto;
      padding: 1.25rem;
      background-color: #fff;
      border-radius: 0.3125rem;
      box-shadow: 0 0.125rem 0.25rem rgba(0, 0, 0, 0.1);
    }

    h1 {
      margin-top: 0;
      margin-bottom: 1.25rem;
      text-align: center;
      color: #333;
    }

    .project-details {
      margin-bottom: 2.5rem;
      margin-top:2.5rem ;
      text-align: center;
    }

    .project-details p {
      margin: 0;
      line-height: 1.5;
      color: #666;
    }

    .project-details ul {
      list-style-type: disc;
      padding-left: 1.25rem;
      color: #666;
    }

    .project-actions {
      margin-bottom: 1.875rem;
      text-align: center;
    }

    .project-actions button {
      display: inline-block;
      padding: 0.625rem 1.25rem;
      background-color: #4F46E5;
      color: #fff;
      border: none;
      border-radius: 0.3125rem;
      cursor: pointer;
      font-size: 1rem;
      text-decoration: none;
      margin: 0.625rem;
    }

    .project-actions button:hover {
      background-color: #0056b3;
    }

    .latest-submission {
      font-weight: bold;
      text-align: center;
      color: #333;
    }

    .file-upload {
      border: 0.125rem dashed #ccc;
      border-radius: 0.3125rem;
      padding: 1.25rem;
      text-align: center;
    }

    .file-upload input[type="file"] {
      display: none;
    }

    .file-upload label {
      display: block;
      margin-bottom: 0.625rem;
      cursor: pointer;
    }

    .file-upload .upload-icon {
      font-size: 3rem;
      color: #666;
    }

    .file-upload .upload-text {
      font-size: 1rem;
      color: #666;
    }

    @media (max-width: 31.25rem) {
      html {
        font-size: 14px;
      }

      .container {
        padding: 0.625rem;
      }

      h1 {
        font-size: 1.5rem;
      }

      .project-actions button {
        font-size: 0.875rem;
      }
    }

    /* Two-column layout styles */
    .two-column {
      display: flex;
      justify-content: space-between;
      margin-top: 2.5rem ;
      margin-bottom: 2.5rem;
    }

    .two-column-item {
      flex-basis: calc(50% - 0.625rem);
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>MUSIC PLAYER</h1>
    <div class="project-details">
      <div class="two-column">
        <div class="two-column-item">
          <p><strong>SKILLS:</strong> {{ project.skills_req }}</p>
          <p><strong>LEVEL:{{ project.level }}</strong></p>
        </div>
        <div class="two-column-item">
          <p><strong>CREDITS:{{ project.credits }}</strong> </p>
          <p><strong>DURATION:{{ project.duration }}</strong></p>
        </div>
      </div>
      <p><strong>WHAT YOU’LL LEARN:</strong></p>
      <ul>
        {% for point in project.points.all %}
          <li>{{ point.name }}</li>
        {% endfor %}
      </ul>
    </div>

    <div class="project-actions">
      <button id="download-pdf">Download PDF</button>
      <div class="file-upload">
        <input type="file" name="zip-file" id="zip-file" required>
        <label for="zip-file">
          <i class="fas fa-cloud-upload-alt upload-icon"></i>
          <span class="upload-text">Click to upload ZIP file</span>
        </label>
      </div>
      <button type="submit">Submit ZIP File</button>
    </div>

    <div class="latest-submission">
      <p>Latest Submission: <a href="/submissions/latest">Download ZIP</a></p>
    </div>
  </div>

  <script>
    // Add event listener to the "Download PDF" button
    document.getElementById("download-pdf").addEventListener("click", function() {
      // Replace "pdf-url" with the actual URL of the PDF file to be downloaded
      const pdfUrl = "https://example.com/path/to/pdf";
      window.location.href = pdfUrl;
    });
  </script>
</body>
</html>
