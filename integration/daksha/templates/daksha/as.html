<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f2f2f2;
        }

        .container {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        h1 {
            color: #333;
            text-align: center;
            margin-bottom: 30px;
        }

        p.subtitle {
            color: #777;
            font-size: 18px;
            text-align: center;
            margin-bottom: 20px;
        }

        blockquote {
            text-align: center;
            margin: 0;
            padding: 0;
        }

        blockquote p {
            font-size: 20px;
            margin: 0;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Activation Successful</h1>
        <p class="subtitle">Here's a quote to inspire you:</p>
        <blockquote>
            <p>"The future belongs to those who believe in the beauty of their dreams." - Eleanor Roosevelt</p>
        </blockquote>
        <h3><a href="{% url 'index' %}">Click here</a> to Log In</h3>
    </div>
</body>
</html>
